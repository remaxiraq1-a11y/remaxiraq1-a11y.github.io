# يعيد بناء صفحات المنتجات والأقسام وملف sitemap تلقائياً كل ما يتعدل products.json
name: build product pages
on:
  push:
    branches: [main]
    paths: [products.json, tools/build_catalog.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/build_catalog.py
      - run: |
          git config user.name "remax-bot"
          git config user.email "remax-bot@users.noreply.github.com"
          git add -A p c sitemap.xml robots.txt catalog.csv
          git diff --cached --quiet || (git commit -m "تحديث صفحات المنتجات و sitemap تلقائياً" && git push)
